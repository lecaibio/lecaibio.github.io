<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="900" fill="#fcfcfb"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a69e"/>
    </marker>
  </defs>

  <style>
    .box   { fill:#ffffff; stroke:#2a78d6; stroke-width:1.6; rx:6; }
    .exit  { fill:#f4f3f0; stroke:#c9c7bf; stroke-width:1.2; rx:6; }
    .leaf  { fill:#fdf1ea; stroke:#eb6834; stroke-width:1.6; rx:6; }
    .t     { font-size:13.5px; fill:#0b0b0b; }
    .code  { font-size:11px; fill:#52514e; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
    .lbl   { font-size:11.5px; fill:#52514e; }
    .exitt { font-size:12px; fill:#6b6960; }
    .flow  { stroke:#52514e; stroke-width:1.6; fill:none; marker-end:url(#a); }
    .join  { stroke:#52514e; stroke-width:1.6; fill:none; }
    .gflow { stroke:#a8a69e; stroke-width:1.3; fill:none; marker-end:url(#ag); }
    .note  { font-size:12px; fill:#c0511f; }
  </style>

  <!-- wellness encounter -->
  <rect class="box" x="155" y="24" width="270" height="42"/>
  <text class="t" x="290" y="50" text-anchor="middle">Wellness encounter</text>
  <path class="flow" d="M290,66 L290,112"/>
  <text class="lbl" x="301" y="93">fires 80% of the time</text>

  <!-- eligibility -->
  <rect class="box" x="155" y="114" width="270" height="42"/>
  <text class="t" x="290" y="140" text-anchor="middle">Check eligibility</text>
  <path class="gflow" d="M425,135 L495,135"/>
  <rect class="exit" x="499" y="90" width="288" height="90"/>
  <text class="exitt" x="513" y="111">Not screened. Excluded if:</text>
  <text class="exitt" x="513" y="130">under 12 · pregnant</text>
  <text class="code"  x="513" y="149">active MDD 370143000</text>
  <text class="code"  x="513" y="167">careplan 183401008</text>
  <path class="flow" d="M290,156 L290,196"/>

  <!-- depression screening procedure -->
  <rect class="box" x="155" y="198" width="270" height="50"/>
  <text class="t" x="290" y="219" text-anchor="middle">Depression screening</text>
  <text class="code" x="290" y="237" text-anchor="middle">SNOMED 171207006</text>

  <!-- teen branch -->
  <path class="gflow" d="M155,223 L92,223 L92,300"/>
  <text class="lbl" x="96" y="216">under 18</text>
  <rect class="exit" x="10" y="302" width="138" height="76"/>
  <text class="exitt" x="22" y="323">Teen instrument,</text>
  <text class="exitt" x="22" y="341">9% positive</text>
  <text class="code"  x="22" y="361">LOINC 89204-2</text>

  <path class="flow" d="M290,248 L290,296"/>
  <text class="lbl" x="301" y="277">adult</text>

  <!-- PHQ-2 -->
  <rect class="box" x="155" y="298" width="270" height="50"/>
  <text class="t" x="290" y="319" text-anchor="middle">PHQ-2 administered</text>
  <text class="code" x="290" y="337" text-anchor="middle">6% positive, hard-coded</text>
  <path class="flow" d="M290,348 L290,392"/>

  <!-- PHQ-2 result -->
  <rect class="box" x="155" y="394" width="270" height="50"/>
  <text class="t" x="290" y="415" text-anchor="middle">PHQ-2 result recorded</text>
  <text class="code" x="290" y="433" text-anchor="middle">LOINC 55757-9 / 55758-7</text>
  <path class="gflow" d="M425,419 L495,419"/>
  <rect class="exit" x="499" y="397" width="250" height="44"/>
  <text class="exitt" x="513" y="424">score &lt; 3 — stop here (94%)</text>
  <path class="flow" d="M290,444 L290,488"/>
  <text class="lbl" x="301" y="470">score ≥ 3</text>

  <!-- PHQ-9 -->
  <rect class="box" x="155" y="490" width="270" height="50"/>
  <text class="t" x="290" y="511" text-anchor="middle">PHQ-9 administered</text>
  <text class="code" x="290" y="529" text-anchor="middle">SNOMED 715252007</text>

  <!-- branches -->
  <path class="flow" d="M225,540 L225,586"/>
  <path class="flow" d="M355,540 L355,586"/>
  <text class="lbl" x="200" y="567" text-anchor="end">80%</text>
  <text class="lbl" x="380" y="567">20%</text>
  <rect class="box" x="101" y="588" width="182" height="46"/>
  <text class="code" x="192" y="608" text-anchor="middle">phqa_score =</text>
  <text class="code" x="192" y="624" text-anchor="middle">UNIFORM(5, 27)</text>
  <rect class="box" x="297" y="588" width="182" height="46"/>
  <text class="code" x="388" y="608" text-anchor="middle">phqa_score =</text>
  <text class="code" x="388" y="624" text-anchor="middle">UNIFORM(3, 4)</text>

  <path class="join" d="M192,634 L192,660 L388,660 L388,634"/>
  <path class="flow" d="M290,660 L290,690"/>

  <!-- result -->
  <rect class="leaf" x="155" y="692" width="270" height="50"/>
  <text class="t" x="290" y="713" text-anchor="middle">PHQ-9 result recorded</text>
  <text class="code" x="290" y="731" text-anchor="middle">LOINC 44249-1 / 44261-6</text>
  <path class="flow" d="M290,742 L290,784"/>

  <!-- terminal -->
  <rect class="leaf" x="190" y="786" width="200" height="42"/>
  <text class="t" x="290" y="812" text-anchor="middle">Terminal</text>

  <!-- annotation -->
  <path class="gflow" d="M425,717 L491,717"/>
  <text class="note" x="499" y="700">The score is written here and</text>
  <text class="note" x="499" y="718">never read again. No other</text>
  <text class="note" x="499" y="736">module references phqa_score.</text>

  <text class="lbl" x="24" y="870">Synthea v4.0.0 · encounter/depression_screening.json, called from wellness_encounters.json</text>
</svg>
