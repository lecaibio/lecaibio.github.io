<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="800" height="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="800" height="690" fill="#fcfcfb"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a8a69e"/>
    </marker>
  </defs>

  <style>
    .box   { fill:#ffffff; stroke:#2a78d6; stroke-width:1.6; rx:6; }
    .plain { fill:#f4f3f0; stroke:#c9c7bf; stroke-width:1.2; rx:6; }
    .leaf  { fill:#fdf1ea; stroke:#eb6834; stroke-width:1.6; rx:6; }
    .exit  { fill:#f4f3f0; stroke:#c9c7bf; stroke-width:1.2; rx:6; }
    .t     { font-size:13.5px; fill:#0b0b0b; }
    .code  { font-size:11px; fill:#52514e; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
    .lbl   { font-size:11.5px; fill:#52514e; }
    .exitt { font-size:12px; fill:#6b6960; }
    .flow  { stroke:#52514e; stroke-width:1.6; fill:none; marker-end:url(#a); }
    .gflow { stroke:#a8a69e; stroke-width:1.3; fill:none; marker-end:url(#ag); }
    .bnd   { stroke:#eb6834; stroke-width:1.4; stroke-dasharray:7 5; fill:none; }
    .note  { font-size:12px; fill:#c0511f; }
    .bar   { fill:#2a78d6; opacity:0.28; }
    .barl  { fill:#c9c7bf; }
  </style>

  <!-- cost axis -->
  <path class="flow" d="M46,44 L46,586"/>
  <text class="lbl" x="34" y="315" text-anchor="middle" transform="rotate(-90 34 315)">cost per item, ascending</text>

  <!-- input -->
  <rect class="plain" x="140" y="24" width="360" height="46"/>
  <text class="t" x="320" y="52" text-anchor="middle">More than a million comments</text>
  <rect class="barl" x="140" y="80" width="360" height="7" rx="3"/>
  <text class="lbl" x="510" y="87">everything, before any test is applied</text>
  <path class="flow" d="M320,90 L320,120"/>

  <!-- rules -->
  <rect class="box" x="140" y="122" width="360" height="70"/>
  <text class="t" x="320" y="147" text-anchor="middle">Rules</text>
  <text class="code" x="320" y="167" text-anchor="middle">language · length · URL · emoji · boilerplate</text>
  <text class="code" x="320" y="183" text-anchor="middle">duplicate id · duplicate content</text>
  <path class="gflow" d="M500,157 L524,157"/>
  <rect class="exit" x="528" y="120" width="258" height="74"/>
  <text class="exitt" x="540" y="141">Deterministic and auditable.</text>
  <text class="exitt" x="540" y="160">Cheap enough to run on everything.</text>
  <text class="exitt" x="540" y="179">Every drop has a stated reason.</text>
  <rect class="bar" x="140" y="202" width="90" height="7" rx="3"/>
  <text class="lbl" x="240" y="209">about a quarter of the corpus survives</text>
  <path class="flow" d="M320,212 L320,242"/>

  <!-- embeddings -->
  <rect class="box" x="140" y="244" width="360" height="70"/>
  <text class="t" x="320" y="269" text-anchor="middle">Embeddings, then clustering</text>
  <text class="code" x="320" y="289" text-anchor="middle">a partition, with no names attached to it</text>
  <text class="code" x="320" y="305" text-anchor="middle">reproduces from fixed vectors and a fixed seed</text>
  <path class="gflow" d="M500,279 L524,279"/>
  <rect class="exit" x="528" y="242" width="258" height="74"/>
  <text class="exitt" x="540" y="263">One pass per surviving comment.</text>
  <text class="exitt" x="540" y="282">Gives you the groups, not their</text>
  <text class="exitt" x="540" y="301">meanings.</text>
  <rect class="bar" x="140" y="324" width="11" height="7" rx="3"/>
  <text class="lbl" x="161" y="331">about 3% of the original lands inside a cluster — the rest is not junk, it is rare</text>
  <path class="flow" d="M320,334 L320,394"/>

  <!-- boundary -->
  <path class="bnd" d="M10,362 L790,362"/>
  <text class="lbl" x="786" y="354" text-anchor="end">above · every decision can be stated or replayed</text>
  <text class="note" x="786" y="382" text-anchor="end">below · the layer that cannot explain itself</text>

  <!-- model -->
  <rect class="leaf" x="140" y="396" width="360" height="70"/>
  <text class="t" x="320" y="421" text-anchor="middle">The LLM</text>
  <text class="code" x="320" y="441" text-anchor="middle">describes each cluster, then judges its comments</text>
  <text class="code" x="320" y="457" text-anchor="middle">tens of thousands of calls, not a million</text>
  <path class="gflow" d="M500,431 L524,431"/>
  <rect class="exit" x="528" y="394" width="258" height="74"/>
  <text class="exitt" x="540" y="415">The constrained layer. It runs on a</text>
  <text class="exitt" x="540" y="434">weak model inside the account</text>
  <text class="exitt" x="540" y="453">boundary, because the text cannot leave.</text>
  <path class="flow" d="M320,466 L320,506"/>

  <!-- output -->
  <rect class="leaf" x="180" y="508" width="280" height="46"/>
  <text class="t" x="320" y="536" text-anchor="middle">Labels, and a reason for each one</text>
  <rect class="bar" x="140" y="566" width="2" height="7" rx="1"/>
  <text class="lbl" x="152" y="573">0.2% carried what I was looking for, too small to draw to scale</text>

  <text class="note" x="24" y="626">Each layer exists to reduce how much text reaches the next one.</text>
  <text class="lbl" x="24" y="652">Bar widths are the share of the original corpus surviving each stage. Proportions are real; everything else here is a sketch.</text>
</svg>
